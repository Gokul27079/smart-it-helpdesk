name: Smart IT Help Desk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Train ML artifacts
        run: python ml/train_model.py

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q app.py config.py database ml services tests

  package:
    name: Package verified application
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: |
          zip -qr smart-it-helpdesk.zip . \
            -x '.git/*' '.github/*' '__pycache__/*' '*/__pycache__/*' \
               '.pytest_cache/*' 'helpdesk.db' 'uploads/*'

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-it-helpdesk-${{ github.sha }}
          path: smart-it-helpdesk.zip
          if-no-files-found: error
          retention-days: 14
