{% extends 'base.html' %}{% block title %}Ticket Queue · Smart IT{% endblock %}{% block heading %}Ticket queue{% endblock %}{% block content %}<div class="panel"><div class="panel-head"><div><span class="eyebrow">SERVICE OPERATIONS</span><h2>Manage requests</h2><p class="muted">Search, filter, and update the live support queue.</p></div><a class="button primary" href="{{ url_for('create_ticket') }}">＋ New ticket</a></div><form class="filters" method="get"><input name="q" value="{{ filters.q }}" placeholder="Search ID, title, user..."><select name="category"><option value="">All categories</option>{% for x in ['Hardware','Software','Network','Access & Account','Security','Email','Database','Other'] %}<option {% if filters.category==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="priority"><option value="">All priorities</option>{% for x in ['Critical','High','Medium','Low'] %}<option {% if filters.priority==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="status"><option value="">All statuses</option>{% for x in ['Open','In Progress','Resolved','Closed'] %}<option {% if filters.status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="sort"><option value="newest" {% if filters.sort!='oldest' %}selected{% endif %}>Newest first</option><option value="oldest" {% if filters.sort=='oldest' %}selected{% endif %}>Oldest first</option></select><button class="button secondary" type="submit">Apply</button></form>{% include '_ticket_table.html' %}</div>{% endblock %}
